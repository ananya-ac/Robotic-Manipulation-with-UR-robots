# mujoco_ros2_control plugin config, loaded as a plain ROS param file into ros2_control_node
# (same mechanism as ur_mujoco_2f85_controllers.yaml, NOT a <ros2_control><hardware><param>
# in the URDF - confirmed against mujoco_ros2_control_demos' 01_basic_robot.launch.py, the
# only reference implementation, which passes this exact file as another ParameterFile(...)
# entry alongside the controllers yaml).
#
# free_joint_state_publisher: makes the tabletop cubes' poses observable from outside the
# sim - needed to verify a grasp actually holds (cube pose tracks the gripper through a lift)
# rather than eyeballing it. Publishes ALL free-joint bodies in the compiled model
# (mujoco_ros2_control_msgs/msg/FreeJointStateArray on topic "free_joint_states"; confirmed
# via the plugin library that there's no body-allowlist param - it auto-discovers every free
# joint, so it will also publish the D435... no, the camera has no free joint; it will just
# publish cube_0/cube_1/cube_2, the only free-joint bodies in tabletop_mujoco.xml).
# frame_id="" means poses are in the world frame (see FreeJointStateArray.msg's own doc).
#
# CHECK LIVE: the camera plugin (CameraPlugin) was found to publish inside its OWN node
# namespace ("mujoco_camera_plugin/...") rather than at the requested topic root, requiring
# absolute (leading-/) topic overrides to fix - confirm via `ros2 topic list` whether
# free_joint_states needs the same treatment before relying on it.
/**:
  ros__parameters:
    mujoco_plugins:
      free_joint_state_publisher:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
        frame_id: ""
        # 100 Hz (was 30): stack_bc's recorder samples cube poses on a 10 Hz sim-time tick, and
        # its grasp/success checks compare cube and gripper motion - keep the staleness of the
        # latest cached pose well under one tick.
        publish_rate: 100.0
      # Wrist camera, configured explicitly for its rate. Without this entry the CameraPlugin
      # auto-registers at its default 5 Hz, which measured 3.3 Hz delivered (stamp gaps 0.2-0.8 s,
      # sim RTF 1.0) - too slow for stack_bc's 10 Hz recorder (wrist images). 20 Hz keeps the
      # newest frame <= ~50 ms old at every tick even with occasional drops. Topics and frame are
      # the ones the URDF <sensor> block gives the auto-configured plugin
      # (ur5e_2f85_camera_mujoco.urdf.xacro); the key under it is the MJCF camera name.
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 20.0
        camera:
          policy: streaming
          frame_name: camera_color_toein_frame
          info_topic: /camera/color/camera_info
          image_topic: /camera/color/image_raw
          depth_topic: /camera/depth/image_rect_raw
        # DP-paper station world (worlds/dp_station_mujoco.xml) only - these entries are unused in
        # worlds without these MJCF cameras. The plugin streams EVERY MJCF camera unless told
        # otherwise, and camera_publish_rate is global (one rate for all streaming cameras), so:
        # front_a (the paper's policy "front camera") streams with the wrist camera, and the three
        # offline-only cameras are disabled (rendered from logged qpos by stack_bc.render_views).
        front_a:
          policy: streaming
          frame_name: front_a
          info_topic: /front_camera/color/camera_info
          image_topic: /front_camera/color/image_raw
          depth_topic: /front_camera/depth/image_rect_raw
        front_b:
          policy: disabled
        topdown:
          policy: disabled
        side:
          policy: disabled
      # Visual domain randomization (src/mujoco_dr_plugin): recolours MJCF materials on request
      # via /color_randomizer/set_colors. Idle (no effect on the scene) until called.
      color_randomizer:
        type: "mujoco_dr_plugin/ColorRandomizerPlugin"
