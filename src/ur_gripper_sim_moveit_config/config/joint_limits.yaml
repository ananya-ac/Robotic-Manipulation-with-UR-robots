# These limits are used by MoveIt and augment/override the definitions in ur_description.
#
# While the robot does not inherently have any limits on joint accelerations (only on torques),
# MoveIt needs them for time parametrization. They were chosen conservatively to work in most use
# cases. For specific applications, higher values might lead to better execution performance.

joint_limits:
  shoulder_pan_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  # Gripper actuated joints. MoveIt's time-optimal trajectory generation requires an
  # acceleration limit for every joint in a planned group; the gz URDFs only carry velocity
  # limits. Both grippers are listed — an entry for a joint absent from the loaded robot is
  # simply ignored. (finger_joint: Hand-E; robotiq_85_left_knuckle_joint: 2F-85.)
  finger_joint:
    has_velocity_limits: true
    max_velocity: 0.15
    has_acceleration_limits: true
    max_acceleration: 0.5
  robotiq_85_left_knuckle_joint:
    # gz rests the knuckle a hair below the URDF lower bound (0.0) at ~-7e-13; the Jazzy
    # CheckStartStateBounds adapter hard-fails on any out-of-bounds revolute start (no
    # tolerance param). Widen the lower bound slightly so the resting state is in-bounds.
    has_position_limits: true
    min_position: -0.02
    max_position: 0.81
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 2.0
