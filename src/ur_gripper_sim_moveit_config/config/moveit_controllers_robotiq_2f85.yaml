# MoveIt controller manager for the UR + Robotiq 2F-85 gz bringup.
# Arm: scaled_joint_trajectory_controller (FollowJointTrajectory).
# Gripper: gripper_controller is a GripperActionController in this bringup
# (see ur_gripper_sim/config/ur_gz_2f85_controllers.yaml), so MoveIt drives it as
# GripperCommand over gripper_controller/gripper_cmd.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - gripper_controller

  scaled_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  gripper_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    joints:
      - robotiq_85_left_knuckle_joint   # 5 mimic joints follow via the URDF
