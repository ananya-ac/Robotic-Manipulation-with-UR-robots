# Vendored unchanged from ur_moveit_config/config/pilz_cartesian_limits.yaml - generic
# Cartesian velocity/accel limits, not robot-specific, needed by the Pilz industrial motion
# planner's LIN (straight-line Cartesian) motion primitive. Added to give grasp scripts a
# straight-line descent/retreat option instead of OMPL's general joint-space sampling for
# the final approach into an object - see mujoco_grasp_test.py's own comments for why
# (an OMPL-planned descent swung the gripper into the cube from an angle and knocked it over).
cartesian_limits:
  max_trans_vel: 1.0
  max_trans_acc: 2.25
  max_trans_dec: -5.0
  max_rot_vel: 1.57
