# UR5e cube stacking from the wrist camera, "overview + context": as stack_wrist_image.yaml, plus
# the episode's frame 0 (the overview the recorded episode starts with, at task.SCAN_Q) as a
# constant second image. Same dataset; the extra key only switches it on in the dataset class.
name: stack_wrist_context_image

image_shape: [3, 240, 320]
shape_meta: &shape_meta
  obs:
    wrist:
      shape: ${task.image_shape}
      type: rgb
    wrist_context:
      shape: ${task.image_shape}
      type: rgb
    proprio:
      shape: [10]        # EE pos3 + EE rot6d + measured gripper width
      type: low_dim
  action:
    shape: [10]          # desired EE pos3 + rot6d + desired width

env_runner:
  _target_: stack_dp.null_image_runner.NullImageRunner

dataset:
  _target_: stack_dp.stack_image_dataset.StackImageDataset
  shape_meta: *shape_meta
  zarr_path: ${oc.env:HOME}/data/stack_bc/wrist.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
