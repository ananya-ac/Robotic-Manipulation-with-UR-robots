# ros2_control controller_manager config for the gz_ros2_control bringup.
# Loaded by the gz_ros2_control system plugin (see ur_gripper_hande_gz.urdf.xacro).
#
# The trajectory controller is named 'scaled_joint_trajectory_controller' so
# ur_control's Arm drives the simulated robot unchanged.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    # FZI Cartesian compliance controller (FDCC). Loaded inactive; ur_control's
    # CompliantController switches it on (it claims the same position command
    # interfaces as scaled_joint_trajectory_controller, so only one runs at a time).
    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

    # JTC gives reliable prismatic position control in gz; GripperActionController
    # overshoots/stalls on finger_joint. ur_control uses FollowJointTrajectory in
    # trajectory mode (see config/gripper_hande_client.yaml).
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

force_torque_sensor_broadcaster:
  ros__parameters:
    # Backed by the gz force_torque sensor on wrist_3_joint (see the <sensor> blocks in
    # the URDF + ros2_control xacro). Reported in the wrist_3_link frame. Publishes on
    # ~/wrench; the launch remaps it to /wrench so ur_control's Arm reads it unchanged
    # (FT_SUBSCRIBER='wrench').
    # sensor_name auto-derives the 6 standard interfaces (tcp_fts_sensor/force.x .. torque.z).
    sensor_name: tcp_fts_sensor
    frame_id: wrist_3_link

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.6

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

gripper_controller:
  ros__parameters:
    # Only the actuated finger; hande_right_finger_joint mimics it (URDF <mimic>,
    # enforced by gz bullet-featherstone) and must not be a controller joint.
    joints:
      - finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.001
      goal_time: 2.0

cartesian_compliance_controller:
  ros__parameters:
    # KDL chain robot_base_link -> end_effector_link (fixed joints past tool0 are fine).
    robot_base_link: base_link
    end_effector_link: gripper_tip_link
    compliance_ref_link: gripper_tip_link
    # Frame the /wrench (tcp_fts_sensor) is expressed in; see ur_gz_controllers FT block.
    # Must be in the arm chain — the controller transforms it to compliance_ref_link via TF.
    ft_sensor_ref_link: wrist_3_link
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    stiffness:  # w.r.t. compliance_ref_link
      trans_x: 500.0
      trans_y: 500.0
      trans_z: 500.0
      rot_x: 20.0
      rot_y: 20.0
      rot_z: 20.0
    solver:
      error_scale: 0.5
      iterations: 1
    pd_gains:
      trans_x: {p: 0.05, d: 0.005}
      trans_y: {p: 0.05, d: 0.005}
      trans_z: {p: 0.05, d: 0.005}
      rot_x: {p: 1.5}
      rot_y: {p: 1.5}
      rot_z: {p: 1.5}
