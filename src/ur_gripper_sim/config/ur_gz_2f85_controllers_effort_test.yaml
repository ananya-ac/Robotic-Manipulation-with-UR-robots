# Phase 0 isolated effort-grasp test (data_plan.md). A dedicated, minimal controllers file --
# not shared with ur_bringup_sim -- paired with ur_gripper_2f85_gz_effort_test.urdf.xacro.
# Only the controllers effort_grasp_test.launch.py actually spawns are declared here.
controller_manager:
  ros__parameters:
    update_rate: 500
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_effort_controller:
      type: effort_controllers/JointGroupEffortController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_effort_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    interface_name: effort
