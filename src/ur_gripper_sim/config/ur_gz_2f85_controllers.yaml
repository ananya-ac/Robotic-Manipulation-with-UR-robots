# ros2_control controllers for the UR + Robotiq 2F-85 gz bringup.
# Loaded by the gz_ros2_control system plugin (see ur_gripper_2f85_gz.urdf.xacro).
#
# The gripper is a position_controllers/GripperActionController on the single actuated
# knuckle joint, exposing gripper_controller/gripper_cmd (control_msgs/GripperCommand) —
# this matches ur_control.grippers.GripperController(gripper_type="85") out of the box.
controller_manager:
  ros__parameters:
    update_rate: 500
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    # FZI Cartesian compliance controller (FDCC). Loaded inactive; ur_control's
    # CompliantController switches it on (it claims the same position command
    # interfaces as scaled_joint_trajectory_controller, so only one runs at a time).
    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

    gripper_controller:
      type: position_controllers/GripperActionController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

force_torque_sensor_broadcaster:
  ros__parameters:
    # Backed by the gz force_torque sensor on wrist_3_joint (see the <sensor> blocks in the
    # URDF). sensor_name auto-derives the 6 standard interfaces (tcp_fts_sensor/force.x ..
    # torque.z). Reported in wrist_3_link; the launch remaps ~/wrench to /wrench so
    # ur_control's Arm reads it unchanged (FT_SUBSCRIBER='wrench').
    sensor_name: tcp_fts_sensor
    frame_id: wrist_3_link

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    max_effort: 50.0
    allow_stalling: true

cartesian_compliance_controller:
  ros__parameters:
    # KDL chain robot_base_link -> end_effector_link (fixed joints past tool0 are fine).
    robot_base_link: base_link
    end_effector_link: gripper_tip_link
    compliance_ref_link: gripper_tip_link
    # Frame the /wrench (tcp_fts_sensor) is expressed in; see force_torque_sensor_broadcaster.
    # Must be in the arm chain — the controller transforms it to compliance_ref_link via TF.
    ft_sensor_ref_link: wrist_3_link
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    stiffness:  # w.r.t. compliance_ref_link
      trans_x: 500.0
      trans_y: 500.0
      trans_z: 500.0
      rot_x: 20.0
      rot_y: 20.0
      rot_z: 20.0
    solver:
      error_scale: 0.5
      iterations: 1
    pd_gains:
      trans_x: {p: 0.05, d: 0.005}
      trans_y: {p: 0.05, d: 0.005}
      trans_z: {p: 0.05, d: 0.005}
      rot_x: {p: 1.5}
      rot_y: {p: 1.5}
      rot_z: {p: 1.5}
