# ros2_control controllers for the UR + Robotiq 2F-85 mujoco_ros2_control bringup.
# MuJoCo counterpart of ur_gz_2f85_controllers.yaml. All ros2_control controller
# types/interfaces are backend-agnostic - identical to the Gazebo file except one line:
# sensor_name below is "tcp_fts" (not "tcp_fts_sensor"), matching the FTS naming
# ur_gripper_2f85_mujoco.urdf.xacro's <ros2_control> block registers under (see that
# file's own comment on why - MujocoSystemInterface requires an explicit
# mujoco_type=fts param and a specific sensor-name convention, and "tcp_fts_sensor"
# doesn't end in "_fts" the way the convention expects).
#
# The gripper is a position_controllers/GripperActionController on the single actuated
# knuckle joint, exposing gripper_controller/gripper_cmd (control_msgs/GripperCommand) —
# this matches ur_control.grippers.GripperController(gripper_type="85") out of the box.
controller_manager:
  ros__parameters:
    update_rate: 500
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    # FZI Cartesian compliance controller (FDCC). Loaded inactive; ur_control's
    # CompliantController switches it on (it claims the same position command
    # interfaces as scaled_joint_trajectory_controller, so only one runs at a time).
    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

    gripper_controller:
      type: position_controllers/GripperActionController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

force_torque_sensor_broadcaster:
  ros__parameters:
    # Backed by ur_gripper_2f85_mujoco.urdf.xacro's tcp_fts sensor (mujoco_type=fts,
    # mujoco_sensor_name=tcp), which auto-derives the 6 standard interfaces
    # (tcp_fts/force.x .. torque.z). Reported in wrist_3_link; the launch remaps
    # ~/wrench to /wrench so ur_control's Arm reads it unchanged (FT_SUBSCRIBER='wrench').
    sensor_name: tcp_fts
    frame_id: wrist_3_link

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    max_effort: 50.0
    allow_stalling: true
    # Defaults (stall_velocity_threshold=0.001 rad/s, stall_timeout=1.0s) never fired live:
    # closing on cube_0 visibly stalls (knuckle plateaus around ~0.66 rad, well short of the
    # 0.8 commanded target - confirmed offline too) but the GripperCommand action hung
    # indefinitely rather than reporting success, blocking the whole grasp script at the
    # gripper-close step. The gripper's mimic/equality-constrained 5-joint linkage already has
    # a documented history of small residual softness/oscillation under load (see
    # ur_gripper_2f85_mujoco.urdf.xacro's own comment on ~15-29% steady-state deviation in some
    # mimic joints) - plausible that the knuckle's actual measured velocity never stays below
    # 0.001 rad/s continuously for a full second while pressed against the cube. Loosened by
    # 10x/halved respectively; not yet re-verified live that this specific pair is sufficient
    # (revisit if gripper-close still hangs, or reduce further if it now reports "stalled"
    # while there's clearly still daylight between the fingers and the object).
    stall_velocity_threshold: 0.01
    stall_timeout: 0.5

cartesian_compliance_controller:
  ros__parameters:
    # KDL chain robot_base_link -> end_effector_link (fixed joints past tool0 are fine).
    robot_base_link: base_link
    end_effector_link: gripper_tip_link
    compliance_ref_link: gripper_tip_link
    # Frame the /wrench (tcp_fts) is expressed in; see force_torque_sensor_broadcaster.
    # Must be in the arm chain — the controller transforms it to compliance_ref_link via TF.
    ft_sensor_ref_link: wrist_3_link
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    stiffness:  # w.r.t. compliance_ref_link
      trans_x: 500.0
      trans_y: 500.0
      trans_z: 500.0
      rot_x: 20.0
      rot_y: 20.0
      rot_z: 20.0
    solver:
      error_scale: 0.5
      iterations: 1
    pd_gains:
      trans_x: {p: 0.05, d: 0.005}
      trans_y: {p: 0.05, d: 0.005}
      trans_z: {p: 0.05, d: 0.005}
      rot_x: {p: 1.5}
      rot_y: {p: 1.5}
      rot_z: {p: 1.5}
